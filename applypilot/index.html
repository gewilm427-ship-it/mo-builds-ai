<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApplyPilot</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f8fc;
      color: #111827;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page {
      width: 100%;
      max-width: 440px;
      padding: 30px 20px;
    }

    .logo {
      text-align: center;
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .tagline {
      text-align: center;
      color: #6b7280;
      margin-bottom: 35px;
    }

    .card {
      background: white;
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.07);
    }

    h2 {
      font-size: 22px;
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      margin-bottom: 18px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    #signUpButton {
      background: #2563eb;
      color: white;
    }

    .divider {
      text-align: center;
      color: #9ca3af;
      margin: 22px 0;
      font-size: 14px;
    }

    #signInButton {
      background: white;
      color: #111827;
      border: 1px solid #d1d5db;
    }

    .footer {
      text-align: center;
      margin-top: 24px;
      color: #9ca3af;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="logo">ApplyPilot</div>
    <p class="tagline">Your university application workspace.</p>

    <div class="card">

      <h2>Create your account</h2>

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="you@example.com"
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
      >

      <button id="signUpButton">Create account</button>

      <div class="divider">Already have an account?</div>

      <button id="signInButton">Sign in</button>

    </div>

    <p class="footer">
      Your application data stays private to your account.
    </p>

  </main>

</body>
</html>
